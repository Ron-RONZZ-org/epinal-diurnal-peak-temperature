[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epinal-peak"
version = "0.1.0"
description = "Investigate whether the clock hour of daily maximum temperature at Epinal, France, has shifted over recent decades."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Rong Zhou", email = "ron.zhou@hey.com"},
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "pooch>=1.8",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pandera>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
manuscript = [
    "quarto",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["epinal_peak*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
